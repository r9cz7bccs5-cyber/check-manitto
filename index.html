<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 🎁 가평 빠지 비밀 마니또 </title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #ff6b6b;
      --text-color: #333333;
      --sub-text: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #ee5253;
    }

    .result-card {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-box {
      background-color: #fff0f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .target-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .mission-box {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      margin-bottom: 10px;
    }

    .mission-title {
      font-size: 0.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .mission-text {
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 비밀 마니또 </h1>
  <p class="subtitle">이름을 입력하여 당신의 마니또와 미션을 확인하세요!</p>

  <div class="input-group">
    <input type="text" id="username" placeholder="이름을 입력하세요" onkeyup="if(window.event.keyCode==13){checkManitto()}">
  </div>
  <button onclick="checkManitto()">결과 확인하기</button>

  <div id="errorMsg" class="error-msg">명단에 없는 이름입니다. 정확히 입력해 주세요.</div>

  <div id="resultCard" class="result-card">
    <div class="result-box">
      <span style="font-size: 0.85rem; color: #666;">당신이 챙겨야 할 마니또</span>
      <div id="targetName" class="target-name">---</div>
    </div>

    <div class="mission-box">
      <div class="mission-title">🎯 당신의 비밀 미션</div>
      <div id="missionText" class="mission-text">---</div>
    </div>
  </div>
</div>

<script>
  // 1. 김민규, 주은성을 제외한 13명 명단
  const PARTICIPANTS = [
    "최예빈", "서하준", "백승엽", "심은솔",
    "이나현", "송채린", "차성제", "김지수",
    "이민혁", "김현성", "김태웅", "이승용", "김성준"
  ];

  // 2. 가평 빠지 일정 맞춤형 미션 13개 (인당 1개 배정)
  const MISSIONS = [
    "이동 타임(경춘선 차 안/픽업 차)에서 마니또 옆자리나 근처 자리에 자연스럽게 앉기",
    "마니또가 물놀이(빠지) 후 체온 떨어지지 않게 수건이나 겉옷 챙겨주거나 안부 물어보기",
    "바베큐 타임 때 마니또 자리에 수저, 휴지, 물, 쌈채소 먼저 셋팅해주기",
    "마니또가 빠지에서 놀거나 펜션에서 쉬고 있을 때 인생샷(단독샷) 2장 이상 찍어주기",
    "빠지 놀이기구 탈 때 마니또와 같은 기구/보트에 탑승하기",
    "바베큐 때 마니또에게 고기, 소시지, 쌈 중 하나를 자연스럽게 먼저 건네거나 싸주기",
    "레크리에이션 게임 진행할 때 마니또가 하는 말이나 행동에 제일 크게 웃어주고 반응하기",
    "마니또 몰래 소소한 주전부리(젤리, 음료, 과자 등)를 가방이나 소지품 근처에 쓱 두고 오기",
    "마니또가 물놀이 후 피곤해할 때 '오늘 진짜 고생했다/재밌었다'며 은밀하게 칭찬 한마디 건네기",
    "빠지나 펜션 배경으로 마니또와 단둘이 셀카 1장 찍기 (자연스럽게 유도하기!)",
    "레크리에이션이나 쉬는 시간에 마니또와 5초 이상 눈 맞추며 진지하게 대화 나누기",
    "마니또 몰래 응원이나 위트 있는 메모(휴지/종이)를 작성해서 소지품 사이에 숨겨두기",
    "레크리에이션 중 마니또에게 '너 오늘 진짜 텐션 좋다/웃기다'라는 말 듣기 (유도하기!)"
  ];

  let matchResults = {};

  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  function generateMatches() {
    let names = [...PARTICIPANTS];
    let shuffled = [...PARTICIPANTS];
    
    let seed = 20260823_01; // 무작위 난수 시드

    let isValid = false;
    while (!isValid) {
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // 본인이 본인을 뽑지 않도록 방지
      isValid = names.every((name, idx) => name !== shuffled[idx]);
    }

    // 미션 목록 무작위 셔플
    let missionPool = [...MISSIONS];
    for (let i = missionPool.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom(seed++) * (i + 1));
      [missionPool[i], missionPool[j]] = [missionPool[j], missionPool[i]];
    }

    // 1대1 매칭 및 미션 1개씩 부여
    names.forEach((name, idx) => {
      matchResults[name] = {
        target: shuffled[idx],
        mission: missionPool[idx]
      };
    });
  }

  function checkManitto() {
    const inputName = document.getElementById("username").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const resultCard = document.getElementById("resultCard");

    if (matchResults[inputName]) {
      errorMsg.style.display = "none";
      document.getElementById("targetName").innerText = `${matchResults[inputName].target} 님`;
      document.getElementById("missionText").innerText = matchResults[inputName].mission;
      resultCard.style.display = "block";
    } else {
      resultCard.style.display = "none";
      errorMsg.style.display = "block";
    }
  }

  generateMatches();
</script>

</body>
</html>
