<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 🎁 비밀 마니또 확인하기 </title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #ff6b6b;
      --text-color: #333333;
      --sub-text: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #ee5253;
    }

    .result-card {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-box {
      background-color: #fff0f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .target-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .mission-box {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      margin-bottom: 10px;
    }

    .mission-title {
      font-size: 0.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .mission-text {
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 비밀 마니또 </h1>
  <p class="subtitle">이름을 입력하여 당신의 마니또와 미션을 확인하세요!</p>

  <div class="input-group">
    <input type="text" id="username" placeholder="이름을 입력하세요" onkeyup="if(window.event.keyCode==13){checkManitto()}">
  </div>
  <button onclick="checkManitto()">결과 확인하기</button>

  <div id="errorMsg" class="error-msg">명단에 없는 이름입니다. 정확히 입력해 주세요.</div>

  <div id="resultCard" class="result-card">
    <div class="result-box">
      <span style="font-size: 0.85rem; color: #666;">당신이 챙겨야 할 마니또</span>
      <div id="targetName" class="target-name">---</div>
    </div>

    <div class="mission-box">
      <div class="mission-title">🎯 미션 1</div>
      <div id="missionText1" class="mission-text">---</div>
    </div>

    <div class="mission-box">
      <div class="mission-title">🎯 미션 2</div>
      <div id="missionText2" class="mission-text">---</div>
    </div>
  </div>
</div>

<script>
  // 1. 요청하신 15명 참가자 명단
  const PARTICIPANTS = [
    "최예빈", "서하준", "백승엽", "김민규", "심은솔",
    "이나현", "송채린", "차성제", "김지수", "주은성",
    "이민혁", "김현성", "김태웅", "이승용", "김성준"
  ];

  // 2. 총 30개의 미션 목록
  const MISSIONS = [
    "마니또 몰래 인생샷(단독샷) 3장 이상 찍어주고 나중에 공유하기",
    "마니또가 이야기할 때 반응 제일 잘해주고 맞장구치기",
    "식사나 음료 타임에 마니또 수저, 휴지, 물 먼저 챙겨주기",
    "마니또가 요즘 자주 듣는 노래나 관심사 슬쩍 물어보고 기억하기",
    "이동할 때(걸을 때나 차 안에서) 마니또 근처에 앉거나 같이 걸어가며 텐션 올려주기",
    "여행 동안 마니또의 구체적인 장점이나 칭찬 2번 이상 자연스럽게 해주기",
    "마니또의 가방, 외투, 짐 중 하나를 1번 이상 대신 들어주거나 챙겨주기",
    "편의점이나 카페에서 마니또가 좋아할 만한 소소한 주전부리 몰래 가방에 넣어두기",
    "단체 사진 찍을 때 마니또 바로 옆자리나 근처에 서서 찍기",
    "마니또가 단체 대화나 행동에서 소외되지 않도록 말 걸어주고 챙겨주기",
    "마니또와 단둘이 셀카 1장 남기기 (자연스럽게 유도해서 티 안 나게!)",
    "하루 일정이 끝날 때 마니또에게 '오늘 고생 많았다'고 다정하고 은밀하게 한마디 건네기",
    "마니또 몰래 응원이나 위트 있는 짧은 메모를 적어서 소지품 사이에 숨겨두기",
    "마니또 메신저로 뜬금없이 웃긴 짤이나 이모티콘 보내서 웃게 만들기",
    "마니또가 말하는 작은 습관이나 취향 하나를 기억했다가 언급해서 놀라게 하기",
    "이동 시 마니또보다 먼저 문 열어주거나 길 안내/조심하라고 챙겨주기",
    "마니또가 찍어달라고 안 했을 때 자연스럽게 '거기 서봐! 찍어줄게' 하고 사진 남겨주기",
    "마니또가 무언가 고르거나 결정할 때(메뉴, 소지품 등) 적극적으로 추천/편 들어주기",
    "식사나 디저트 먹을 때 '이거 진짜 맛있다'며 마니또한테 제일 먼저 권하기",
    "마니또의 착장이나 스타일(신발, 옷, 액세서리 등) 중 하나를 콕 집어서 칭찬하기",
    "마니또가 던진 유머나 장난에 3초 이상 크게 웃어주기",
    "마니또가 쓰레기나 휴지 등을 들고 방황할 때 슬쩍 뺏어서 대신 버려주기",
    "여행 일정 중 마니또에게 자연스럽게 '나중에 너랑 어디 또 놀러 가고 싶다'고 말하기",
    "단체 이동 시 마니또가 잘 따라오고 있는지 슬쩍 뒤돌아보며 체크하기",
    "마니또가 피곤해 보이거나 지쳤을 때 슬쩍 시원한 바람/자리를 양보하거나 괜찮냐고 물어보기",
    "마니또와 5초 이상 눈을 맞추며 진지하게 대화나 이야기 나누기",
    "마니또 몰래 귀여운 낙서나 응원 문구를 적은 휴지/종이를 마니또 자리에 두고 오기",
    "마니또가 말한 과거의 작은 에피소드나 tmi를 대화 중 자연스럽게 기억해내서 말하기",
    "마니또에게 '너 오늘 텐션 되게 좋다' 혹은 '너랑 있으면 편하다'라는 말 듣기 (유도하기!)",
    "마니또의 특이한 말버릇이나 행동을 유심히 관찰했다가 똑같이 1번 따라 해보기"
  ];

  let matchResults = {};

  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  function generateMatches() {
    let names = [...PARTICIPANTS];
    let shuffled = [...PARTICIPANTS];
    
    let seed = 20260819_06;

    let isValid = false;
    while (!isValid) {
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      isValid = names.every((name, idx) => name !== shuffled[idx]);
    }

    let missionPool = [...MISSIONS];
    for (let i = missionPool.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom(seed++) * (i + 1));
      [missionPool[i], missionPool[j]] = [missionPool[j], missionPool[i]];
    }

    names.forEach((name, idx) => {
      const m1 = missionPool[idx * 2];
      const m2 = missionPool[idx * 2 + 1];

      matchResults[name] = {
        target: shuffled[idx],
        mission1: m1,
        mission2: m2
      };
    });
  }

  function checkManitto() {
    const inputName = document.getElementById("username").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const resultCard = document.getElementById("resultCard");

    if (matchResults[inputName]) {
      errorMsg.style.display = "none";
      document.getElementById("targetName").innerText = `${matchResults[inputName].target} 님`;
      document.getElementById("missionText1").innerText = matchResults[inputName].mission1;
      document.getElementById("missionText2").innerText = matchResults[inputName].mission2;
      resultCard.style.display = "block";
    } else {
      resultCard.style.display = "none";
      errorMsg.style.display = "block";
    }
  }

  generateMatches();
</script>

</body>
</html>
