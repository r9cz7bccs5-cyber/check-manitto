<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 비밀 마니또 확인하기 </title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary-color: #ff6b6b;
      --text-color: #333333;
      --sub-text: #777777;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #ee5253;
    }

    .result-card {
      display: none;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
      animation: fadeIn 0.4s ease-in-out;
    }

    .result-box {
      background-color: #fff0f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .target-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .mission-box {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
    }

    .mission-title {
      font-size: 0.8rem;
      color: var(--sub-text);
      margin-bottom: 5px;
      font-weight: bold;
    }

    .mission-text {
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 비밀 마니또 </h1>
  <p class="subtitle">이름을 입력하여 당신의 마니또와 미션을 확인하세요!</p>

  <div class="input-group">
    <input type="text" id="username" placeholder="이름을 입력하세요" onkeyup="if(window.event.keyCode==13){checkManitto()}">
  </div>
  <button onclick="checkManitto()">결과 확인하기</button>

  <div id="errorMsg" class="error-msg">명단에 없는 이름입니다. 정확히 입력해 주세요.</div>

  <div id="resultCard" class="result-card">
    <div class="result-box">
      <span style="font-size: 0.85rem; color: #666;">당신이 챙겨야 할 마니또</span>
      <div id="targetName" class="target-name">---</div>
    </div>

    <div class="mission-box">
      <div class="mission-title">🎯 당신의 비밀 미션</div>
      <div id="missionText" class="mission-text">---</div>
    </div>
  </div>
</div>

<script>
  // 1. 15명 참가자 명단 (실제 이름으로 변경 가능)
  const PARTICIPANTS = [
    "김가영", "김남건", "김리원", "김주한", "김예루",
    "박승진", "임영혜", "우정윤", "원은솔", "이윤서",
    "이윤성", "장동민", "정지우", "조민재", "서하준"
  ];

  // 2. 15개의 미션 목록 (원하는 미션으로 변경 가능)
  const MISSIONS = [
    "상대방에게 몰래 작은 간식 선물하기",
    "하루 동안 상대방의 말에 반응 잘해주기",
    "상대방의 칭찬거리 은근슬쩍 말하기",
    "상대방 사진 한 장 예쁘게 찍어주기",
    "따뜻한 음료나 물 챙겨주기",
    "상대방이 좋아하는 것 은근히 알아내기",
    "마주칠 때마다 먼저 밝게 인사하기",
    "상대방의 장점 메시지로 전해보기",
    "웃긴 짤이나 이모티콘 보내서 웃게 만들기",
    "상대방 주변 자리 깔끔하게 정리해주기",
    "상대방만을 위한 응원 메시지 남기기",
    "끝날 때까지 마니또 정체 절대 안 들키기",
    "상대방이 좋아하는 음악 물어보기",
    "오늘 하루 상대방의 수고를 격려하기",
    "상대방과 자연스럽게 셀카 한 장 찍기"
  ];

  let matchResults = {};

  // 시드 고정형 랜덤 함수 (모든 접속자가 고정된 동일 결과를 확인하도록 설정)
  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  function generateMatches() {
    let names = [...PARTICIPANTS];
    let shuffled = [...PARTICIPANTS];
    
    let seed = 20261515; // 15명 고정 시드값

    let isValid = false;
    while (!isValid) {
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed++) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // 본인이 본인을 뽑지 않도록 검증
      isValid = names.every((name, idx) => name !== shuffled[idx]);
    }

    // 각 인원별 마니또 및 미션 1:1 매칭
    names.forEach((name, idx) => {
      const missionIndex = Math.floor(seededRandom(seed++) * MISSIONS.length);
      matchResults[name] = {
        target: shuffled[idx],
        mission: MISSIONS[missionIndex]
      };
    });
  }

  function checkManitto() {
    const inputName = document.getElementById("username").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    const resultCard = document.getElementById("resultCard");

    if (matchResults[inputName]) {
      errorMsg.style.display = "none";
      document.getElementById("targetName").innerText = `${matchResults[inputName].target} 님`;
      document.getElementById("missionText").innerText = matchResults[inputName].mission;
      resultCard.style.display = "block";
    } else {
      resultCard.style.display = "none";
      errorMsg.style.display = "block";
    }
  }

  generateMatches();
</script>

</body>
</html>
